<div class="login-wrapper">
  <div class="login-container">
    <div class="brand-side">
      <div class="brand-content">
        <img src="logo-urbana.png" alt="Urbana PE" class="brand-logo" />
        <h1>Mobilidade Urbana em Movimento</h1>
        <p>Gestão centralizada de utilizadores e cartões de transporte metropolitano.</p>
      </div>
      <div class="brand-footer">
        <span>&copy; Região Metropolitana do Recife</span>
      </div>
    </div>

    <div class="form-side">
      <div class="form-header">
        <h2>Acesso ao Sistema</h2>
        <p>Insira as suas credenciais para gerir a plataforma</p>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <span class="error-icon">⚠️</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="exemplo@urbana.com.br"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha de Acesso</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>Entrar no Sistema</span>
        </button>
      </form>
    </div>
  </div>
</div>
